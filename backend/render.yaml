services:
  - type: web
    name: tone-reply-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --loop asyncio
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: LLM_PROVIDER
        value: "openapis"
      - key: LLM_API_KEY
        value: "shared-beta-key"
      - key: LLM_BASE_URL
        value: "https://openapis.online/openai"
      - key: LLM_MODEL
        value: "gpt-5.4-mini"
      - key: CORS_ORIGINS
        value: "https://tonereply.higgsfield.app,http://localhost:8000,http://localhost:19006"
